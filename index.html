<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Tsubasa~ Cloud</title>
    <script>
      (function () {
        try {
          var choice = localStorage.getItem('tsubasa-theme-choice') || 'auto';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = choice === 'dark' || (choice === 'auto' && prefersDark);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.backgroundColor = isDark ? '#0b1412' : '#eef2ec';
          document.documentElement.style.color = isDark ? '#e5f2eb' : '#111d18';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light dark;
        background-color: #0b1412;
        color: #e5f2eb;
      }
      :root[data-theme='light'] {
        color-scheme: light;
        background-color: #eef2ec;
        color: #111d18;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        background-color: #0b1412;
        color: #e5f2eb;
      }
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
